services:
  postgres:
    image: postgres:16-alpine
    container_name: studyflow-postgres
    environment:
      POSTGRES_USER: studyflow
      POSTGRES_PASSWORD: studyflow_dev
      POSTGRES_DB: studyflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyflow -d studyflow"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - studyflow-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: studyflow-api
    environment:
      APP_NAME: StudyFlow API
      APP_ENV: development
      DEBUG: "true"
      DATABASE_URL: postgresql+psycopg://studyflow:studyflow_dev@postgres:5432/studyflow
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-replace_with_a_secure_random_secret}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      BCRYPT_ROUNDS: 12
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - studyflow-network
    volumes:
      - .:/app

volumes:
  postgres_data:

networks:
  studyflow-network:
    driver: bridge