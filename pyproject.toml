[project]
name = "studyflow-api"
version = "0.1.0"
description = "StudyFlow API - A REST API for academic task management"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.30.6",
    "sqlalchemy==2.1.6",
    "alembic==1.13.1",
    "psycopg==3.2.1",
    "pydantic==2.14.1",
    "pydantic-settings==2.9.1",
    "pydantic-extra-types==2.10.1",
    "pyjwt==2.15.1",
    "passlib==1.7.4",
    "argon2-cffi==25.1.0",
    "python-dotenv==1.2.4",
    "email-validator==2.2.0",
    "slowapi==0.1.10",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "httpx==0.27.2",
    "pytest-cov==5.0.0",
    "greenlet==3.5.6",
    "aiosqlite==0.22.1",
    "ruff==0.9.0",
    "mypy==1.14.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --strict-config"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "T20", # flake8-print
]
ignore = [
    "B008",  # Function call in argument default (standard FastAPI pattern)
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
strict = false
show_error_codes = true

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "*/__pycache__/*", "*/.venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    'if __name__ == "__main__":',
]